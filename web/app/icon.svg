<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- El epicentro y sus anillos: lo mismo que dibuja el mapa del hero,
       reducido a lo que cabe en 16 píxeles de pestaña. -->
