  <circle cx="16" cy="16" r="11" fill="none" stroke="#D9480F" stroke-width="1.5" opacity=".3"/>
  <circle cx="16" cy="16" r="7" fill="none" stroke="#FF7A45" stroke-width="1.75" opacity=".6"/>
  <circle cx="16" cy="16" r="3" fill="#FF7A45"/>
</svg>
